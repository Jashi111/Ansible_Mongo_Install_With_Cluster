---
# Author: jashi111
# Description: Playbook to install MongoDB 8.0 and configure the system

- name: Install and Configure MongoDB Replica Set
  hosts: mongodb
  become: true
  gather_facts: false
  vars_files:
    - vars.yml

  vars_prompt:
    - name: confirm_pre_tasks
      prompt: "Do you want to execute the pre-tasks (stop and purge existing MongoDB setup)? (yes/no)"
      private: no

  pre_tasks:

    - name: Stop MongoDB service
      ansible.builtin.systemd:
        name: mongod
        state: stopped
        enabled: false
      when: confirm_pre_tasks == 'yes'

    - name: Remove MongoDB packages
      ansible.builtin.apt:
        name: "mongodb-org*"
        state: absent
        purge: yes
      when: confirm_pre_tasks == 'yes'

    - name: Remove MongoDB data directory
      ansible.builtin.file:
        path: /var/lib/mongodb
        state: absent
      when: confirm_pre_tasks == 'yes'

    - name: Remove MongoDB log directory
      ansible.builtin.file:
        path: /var/log/mongodb
        state: absent
      when: confirm_pre_tasks == 'yes'

    - name: Remove MongoDB configuration file
      ansible.builtin.file:
        path: /etc/mongod.conf
        state: absent
      when: confirm_pre_tasks == 'yes'

    - name: Remove MongoDB repository file
      ansible.builtin.file:
        path: "/etc/apt/sources.list.d/mongodb-org-*.list"
        state: absent
      when: confirm_pre_tasks == 'yes'

    - name: Update APT package list
      ansible.builtin.apt:
        update_cache: yes
      when: confirm_pre_tasks == 'yes'

  tasks:
    - name: Install pip using apt
      ansible.builtin.apt:
        name: python3-pip
        state: present

    - name: Install pymongo
      apt:
        name: python3-pymongo
        state: present
        update_cache: yes

    - name: Download MongoDB GPG key
      ansible.builtin.get_url:
        url: https://www.mongodb.org/static/pgp/server-8.0.asc
        dest: /usr/share/keyrings/mongodb-server-8.0.asc
        mode: '0644'

    - name: Convert MongoDB GPG key to dearmored format
      ansible.builtin.command:
        cmd: gpg --dearmor -o /usr/share/keyrings/mongodb-server-8.0.gpg /usr/share/keyrings/mongodb-server-8.0.asc
      args:
        creates: /usr/share/keyrings/mongodb-server-8.0.gpg

    - name: Add MongoDB repository
      ansible.builtin.apt_repository:
        repo: "deb [arch=amd64,arm64 signed-by=/usr/share/keyrings/mongodb-server-8.0.gpg] https://repo.mongodb.org/apt/ubuntu noble/mongodb-org/8.0 multiverse"
        filename: "mongodb-org-8.0"
        state: present

    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: yes

    - name: Install MongoDB
      ansible.builtin.apt:
        name: mongodb-org
        state: present
        update_cache: yes

    - name: Reload systemd manager configuration
      ansible.builtin.systemd:
        daemon_reload: yes

    - name: Ensure MongoDB service is started
      ansible.builtin.service:
        name: mongod
        state: started
        enabled: true

    - name: Replace Values in mongod.conf
      ansible.builtin.replace:
        path: /etc/mongod.conf
        regexp: "{{ item.regexp }}"
        replace: "{{ item.replace }}"
      loop:
        - { regexp: '#  engine:', replace: '  engine: wiredTiger' }
        - { regexp: '127.0.0.1', replace: '0.0.0.0' }
        - { regexp: '#replication', replace: 'replication' }

    - name: Add Additional Data to mongod.conf
      ansible.builtin.lineinfile:
        path: /etc/mongod.conf
        insertafter: "{{ item.insert_after }}"
        line: "{{ item.new_line }}"
      loop:
        - { insert_after: "^systemLog:", new_line: "  logRotate: reopen" }
        - { insert_after: "^net:", new_line: "  bindIp: 0.0.0.0" }
        - { insert_after: "^replication:", new_line: "  oplogSizeMB: 1" }
        - { insert_after: "^replication:", new_line: "  replSetName: {{ REPLICA_NAME }}" }

    - name: Restart MongoDB
      ansible.builtin.service:
        name: mongod
        state: restarted
        enabled: true

    - name: Wait for little time
      ansible.builtin.pause:
        seconds: 10

    - name: Ensure replicaset exists
      community.mongodb.mongodb_replicaset:
        login_host: "{{ groups['mongodb'][0] }}"
        login_user: admin
        login_password: admin
        replica_set: "{{ REPLICA_NAME }}"
        members:
          - host: "{{ groups['mongodb'][0] }}:27017"
          - host: "{{ groups['mongodb'][1] }}:27017"
          - host: "{{ groups['mongodb'][2] }}:27017"
        arbiter_at_index: 2
      delegate_to: "{{ groups['mongodb'][0] }}"
      run_once: true
    
    - name: Wait for replication setup
      ansible.builtin.pause:
        seconds: 10

    - name: Find the MongoDB primary node
      ansible.builtin.shell: >
        mongosh --quiet --eval
        'print(rs.status().members.filter(m => m.stateStr == "PRIMARY")[0].name)'
      register: mongo_primary_output
      changed_when: false
      delegate_to: "{{ groups['mongodb'][0] }}"
      run_once: true
    
    - name: Set primary_host fact (strip any trailing whitespace)
      set_fact:
        primary_host: "{{ mongo_primary_output.stdout.strip() }}"
    
    - name: Create MongoDB user on primary node
      community.mongodb.mongodb_user:
        login_host: "{{ primary_host.split(':')[0] }}"  # remove port if exists
        login_port: "{{ (primary_host.split(':')[1] | default('27017')) | int }}"
        database: "{{ DB_NAME }}"
        name: "{{ DB_USER }}"
        password: "{{ DB_PASSWRD }}"
        roles:
          - readWrite
          - dbAdmin
          - userAdmin
        state: present
      delegate_to: "{{ primary_host.split(':')[0] }}"
      run_once: true

    - name: Insert sample document using mongodb_shell
      community.mongodb.mongodb_shell:
        db: "{{ DB_NAME }}"
        login_host: "{{ primary_host.split(':')[0] }}"
        login_user: "{{ DB_USER }}"
        login_password: "{{ DB_PASSWRD }}"
        login_database: "{{ DB_NAME }}"
        eval: 'db.sample_collection.insertOne({message: "Inserted by Ansible Module", created_at: new Date()})'
      delegate_to: "{{ primary_host.split(':')[0] }}"
      run_once: true
